<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ivy's Dress-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, gentle, made for a small child — big taps, no reading needed
   IDEA: a paper-doll dress-up box: a doll on a stage, a drawer of clothes beside her
   PICTURE: the doll herself, large, on a changeable scene
   COLOUR and TYPE: bubblegum pink dominant, sky blue support, sunny yellow accent; Fredoka
   LAYOUT: iPad landscape: stage left, wardrobe right; portrait/phone: stage on top */
:root{color-scheme:light;--pink:#ff5fa8;--pinkl:#ffe1f0;--sky:#dff3ff;--ink:#4a2547;--sun:#ffd84d}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#ffeef6 radial-gradient(circle at 20px 20px,#ffd6ea 3px,transparent 4px) 0 0/40px 40px;color:var(--ink);font:500 16px/1.4 Fredoka,system-ui,sans-serif;overflow-x:clip;user-select:none;-webkit-user-select:none}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;padding:max(14px,env(safe-area-inset-top)) 14px 14px;height:100dvh}
.stage{position:relative;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 6px 0 #f3b6d4,0 12px 30px #ff5fa833}
#doll svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pop{animation:pop .35s ease-out;transform-origin:150px 440px}
@keyframes pop{40%{transform:scale(1.04,.97)}70%{transform:scale(.98,1.02)}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
.tools{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:10px;z-index:2}
.tool{width:58px;height:58px;border-radius:20px;border:0;background:var(--pink);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #c93d82;cursor:pointer}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #c93d82}
.tool svg{width:30px;height:30px}
.tool:disabled{opacity:.45}
.panel{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:28px;padding:14px;box-shadow:0 6px 0 #b9def5,0 12px 30px #4fb3ff22;overflow:hidden}
h1{margin:0 4px;font-size:32px;line-height:1.05;font-weight:700;color:var(--pink)}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:7px}
.tab{border:0;border-radius:16px;background:var(--pinkl);padding:4px 2px 3px;color:var(--ink);font:600 13px Fredoka,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.tab svg{width:100%;height:42px}
.tab.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 #c93d82}
.sw{display:flex;flex-wrap:wrap;gap:10px;padding:2px}
.sw button{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #e6cfe0;cursor:pointer}
.sw button.on{box-shadow:0 0 0 4px var(--pink)}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;align-content:start;padding:4px;-webkit-overflow-scrolling:touch}
.item{aspect-ratio:1;border-radius:20px;border:4px solid transparent;background:var(--sky);padding:2px;cursor:pointer;position:relative}
.item svg{width:100%;height:100%;display:block}
.item.on{border-color:var(--pink);background:#fff0f7}
.item:focus-visible,.tab:focus-visible,.tool:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.nm{position:absolute;left:0;right:0;bottom:4px;font:700 15px Fredoka,sans-serif;color:#fff;text-shadow:0 1px 3px #4a2547}
.none{display:grid;place-items:center;color:#c9a3bd;font-size:44px;font-weight:700}
.looks{display:flex;gap:8px;overflow-x:auto;min-height:0;padding:2px}
.look{flex:none;width:62px;height:92px;border-radius:14px;border:3px solid var(--pinkl);background:#fff;padding:0;position:relative;cursor:pointer}
.look svg{width:100%;height:100%}
.look i{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--pink);font:700 16px/22px Fredoka;font-style:normal;box-shadow:0 0 0 2px var(--pink)}
.hint{font-size:14px;color:#a07898;margin:0 4px}
@media (max-width:820px) and (orientation:portrait),(max-width:600px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:52dvh auto;height:auto}
 .grid{max-height:none;overflow:visible}
 .tool{width:50px;height:50px}
}
</style>
</head>
<body>
<div class="app">
 <div class="stage" id="stage">
  <div class="tools">
   <button class="tool" data-act="undo" id="undoBtn" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
   <button class="tool" data-act="random" aria-label="Surprise me"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="#fff"/><g fill="#ff5fa8"><circle cx="8" cy="8" r="1.8"/><circle cx="16" cy="8" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="8" cy="16" r="1.8"/><circle cx="16" cy="16" r="1.8"/></g></svg></button>
   <button class="tool" data-act="clear" aria-label="Take off clothes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
   <button class="tool" data-act="save" aria-label="Save this look"><svg viewBox="0 0 24 24"><path d="M12 21C5 16 2 12 2 8.5A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 2.5C22 12 19 16 12 21Z" fill="#fff"/></svg></button>
  </div>
  <div id="doll" style="position:absolute;inset:0"></div>
 </div>
 <div class="panel">
  <h1>Ivy's Dress-Up</h1>
  <div class="tabs" id="tabs"></div>
  <div class="sw" id="sw"></div>
  <div class="grid" id="grid"></div>
  <div class="looks" id="looks"></div>
 </div>
</div>
<script>
{
const SKIN=['#ffe3d1','#f8cfae','#e8b48c','#c98d63','#9c6644','#6e4630','#f0c6a0'];
const HAIRC=['#5a341f','#24203a','#f2c94c','#e8734f','#ff8fbf','#9b6bff','#4fb3ff','#56cf95','#f6f1e7','#c9b3ff','#2b1d16'];
const EYEC=['#7a4a2a','#3a7bd5','#2fae6a','#8e5cf0','#e0457b','#26213f','#f0a020','#3b2418'];
const shade=(h,p)=>{const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=p<0?0:255,a=Math.abs(p);r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)};
const P=(d,c,x='')=>`<path d="${d}" fill="${c}" stroke="${shade(c,-.3)}" stroke-width="2" stroke-linejoin="round" ${x}/>`;
const M=s=>`<g transform="matrix(-1 0 0 1 300 0)">${s}</g>`;
const C=(x,y,r,f,x2='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${x2}/>`;
const star=(cx,cy,r,f,o=1)=>{let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${f}" opacity="${o}" stroke-linejoin="round"/>`};
const heart=(cx,cy,s,f)=>`<path d="M${cx} ${cy+s*.9}C${cx-s*1.6} ${cy-s*.1} ${cx-s*.7} ${cy-s*1.1} ${cx} ${cy-s*.35}C${cx+s*.7} ${cy-s*1.1} ${cx+s*1.6} ${cy-s*.1} ${cx} ${cy+s*.9}Z" fill="${f}"/>`;
let SK='#ffe3d1';
const neckU=()=>`<path d="M139 213Q150 228 161 213Z" fill="${SK}"/>`;
const SB='M116 218Q150 210 184 218L188 304Q150 312 112 304Z';
const SS='M124 221Q106 236 100 262L118 270Q124 250 134 236Z';
const LS='M124 221Q102 250 95 292L114 297Q119 262 134 238Z';
const sleeves=(c,d)=>P(d,c)+M(P(d,c));
const SKT='M116 290L184 290L206 360Q150 374 94 360Z';
const band=c=>`<rect x="114" y="285" width="72" height="10" rx="5" fill="${shade(c,-.18)}"/>`;
const bod='M118 218Q150 210 182 218L180 294Q150 300 120 294Z';
const skirt=(len,fl)=>`M120 288L180 288Q${180+fl*.5} ${(288+len)/2} ${180+fl} ${len}Q150 ${len+16} ${120-fl} ${len}Q${120-fl*.5} ${(288+len)/2} 120 288Z`;
const puff=c=>P('M108 236a16 14 0 1 1 30-10Z',c)+M(P('M108 236a16 14 0 1 1 30-10Z',c));
const cloud=(x,y,s=1)=>`<g fill="#fff">${C(x,y,14*s,'#fff')+C(x+16*s,y-8*s,18*s,'#fff')+C(x+34*s,y,14*s,'#fff')}<rect x="${x}" y="${y}" width="${34*s}" height="${14*s}"/></g>`;
const BIG='x="-400" y="-400" width="1100" height="1300"';
const pts=[[30,60],[260,40],[70,200],[240,170],[30,330],[270,300],[110,30],[200,110],[50,440],[260,450],[140,80]];

const SCENES=[
 {n:'Sky',f:()=>`<rect ${BIG} fill="url(#gsk)"/>${cloud(20,70)}${cloud(200,40,.8)}${cloud(220,200,.6)}<rect x="-400" y="420" width="1100" height="500" fill="#9fe08e"/><ellipse cx="150" cy="424" rx="400" ry="16" fill="#b6ec9f"/>`},
 {n:'Candy',f:()=>`<rect ${BIG} fill="#ffd6ea"/>${pts.map((p,i)=>i%2?star(p[0],p[1],12,'#fff',.8):heart(p[0],p[1],10,'#ffb3d6')).join('')}<rect x="-400" y="430" width="1100" height="500" fill="#ffc2df"/>`},
 {n:'Garden',f:()=>`<rect ${BIG} fill="#d6f3ff"/>${cloud(200,60,.7)}<rect x="-400" y="380" width="1100" height="600" fill="#8fd67a"/>${[[20,400],[60,460],[250,410],[280,470],[110,480],[200,470],[30,480]].map((p,i)=>[0,72,144,216,288].map(a=>C(p[0]+7*Math.cos(a*Math.PI/180),p[1]+7*Math.sin(a*Math.PI/180),5,['#ff8fc8','#fff','#b693ff','#ffd84d'][i%4])).join('')+C(p[0],p[1],4,'#ffb020')).join('')}`},
 {n:'Night',f:()=>`<rect ${BIG} fill="url(#gnt)"/>${C(238,70,28,'#fff3b0')}${C(252,60,24,'#3a3178')}${pts.map(p=>star(p[0],p[1],5,'#fff',.9)).join('')}<rect x="-400" y="430" width="1100" height="500" fill="#2a2466"/>`},
 {n:'Beach',f:()=>`<rect ${BIG} fill="#a8e2ff"/>${C(60,70,28,'#ffd54a')}${cloud(190,60,.7)}<rect x="-400" y="320" width="1100" height="90" fill="#47bde0"/><path d="M-20 340q15-8 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/><rect x="-400" y="400" width="1100" height="500" fill="#f6dc9e"/>`},
 {n:'Castle',f:()=>`<rect ${BIG} fill="url(#gpk)"/><g fill="#e3c8ff"><rect x="10" y="230" width="50" height="200"/><path d="M4 232L35 170L66 232Z"/><rect x="240" y="230" width="50" height="200"/><path d="M234 232L265 170L296 232Z"/><rect x="50" y="290" width="200" height="140"/><rect x="120" y="200" width="60" height="100"/><path d="M114 202L150 130L186 202Z"/></g>${star(150,120,8,'#ffd84d')}<rect x="-400" y="430" width="1100" height="500" fill="#ffe0f1"/>`},
 {n:'Concert',f:()=>`<rect ${BIG} fill="#1d1240"/><g opacity=".35"><path d="M40 -10L-40 440H120Z" fill="#ff5fa8"/><path d="M150 -10L60 440H240Z" fill="#7fd6ff"/><path d="M260 -10L180 440H340Z" fill="#c59bff"/></g>${pts.map(p=>star(p[0],p[1],4,'#fff',.7)).join('')}<rect x="-400" y="420" width="1100" height="500" fill="#3a2470"/><rect x="-400" y="420" width="1100" height="6" fill="#ff5fa8"/>${[20,70,230,280].map(x=>C(x,440,6,'#ffd84d')).join('')}`},
 {n:'School',f:()=>`<rect ${BIG} fill="#ffe9b8"/><rect x="24" y="70" width="252" height="130" rx="6" fill="#b07a4a"/><rect x="32" y="78" width="236" height="114" fill="#2f6b4f"/><text x="56" y="126" font-family="Fredoka,sans-serif" font-size="30" font-weight="600" fill="#fff" opacity=".9">A B C</text><text x="176" y="170" font-family="Fredoka,sans-serif" font-size="24" fill="#fff" opacity=".9">1+1=2</text>${C(150,36,20,'#fff','stroke="#ff5fa8" stroke-width="4"')}<path d="M150 36V24M150 36L159 40" stroke="#4a2547" stroke-width="3" stroke-linecap="round"/>${['#ff6b6b','#ffd84d','#69db7c','#4dabf7','#9775fa','#ff8fc8'].map((c,i)=>`<path d="M${i*52-6} 0L${i*52+20} 0L${i*52+7} 22Z" fill="${c}"/>`).join('')}<rect x="-400" y="400" width="1100" height="500" fill="#d9a066"/><path d="M-400 400H700" stroke="#b9824a" stroke-width="4"/><g fill="#f0b46a" stroke="#b9824a" stroke-width="2"><rect x="-6" y="330" width="62" height="12"/><rect x="2" y="342" width="6" height="60"/><rect x="44" y="342" width="6" height="60"/><rect x="244" y="330" width="62" height="12"/><rect x="250" y="342" width="6" height="60"/><rect x="292" y="342" width="6" height="60"/></g><rect x="14" y="316" width="22" height="14" fill="#4dabf7"/><path d="M258 330L284 314" stroke="#ffd84d" stroke-width="5" stroke-linecap="round"/>`},
 {n:'Church',f:()=>`<rect ${BIG} fill="#f6efe4"/>${[40,260].map(x=>`<path d="M${x-26} 220V110A26 26 0 0 1 ${x+26} 110V220Z" fill="#8a6a4a"/><path d="M${x-20} 214V112A20 20 0 0 1 ${x+20} 112V214Z" fill="#7fd6ff"/><path d="M${x-20} 160H${x+20}V214H${x-20}Z" fill="#c59bff"/><path d="M${x} 92V214M${x-20} 160H${x+20}" stroke="#8a6a4a" stroke-width="3"/>${C(x,130,7,'#ffd84d')}`).join('')}${C(150,58,34,'#8a6a4a')}${[0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4;return C(150+17*Math.cos(a),58+17*Math.sin(a),9,['#ff6b6b','#ffd84d','#69db7c','#4dabf7'][i%4])}).join('')}${C(150,58,8,'#fff')}<rect x="-400" y="400" width="1100" height="500" fill="#e8d8c4"/><path d="M118 400L182 400L230 520L70 520Z" fill="#c94a5a"/><g fill="#a0703f" stroke="#7a5230" stroke-width="2"><rect x="-60" y="330" width="130" height="20" rx="4"/><rect x="-60" y="350" width="130" height="40"/><rect x="230" y="330" width="130" height="20" rx="4"/><rect x="230" y="350" width="130" height="40"/></g>${[[60,300],[240,300]].map(([x,y])=>`<rect x="${x-4}" y="${y-30}" width="8" height="30" fill="#fff8e0"/><ellipse cx="${x}" cy="${y-36}" rx="4" ry="7" fill="#ffb020"/>`).join('')}`},
 {n:'Park',f:()=>`<rect ${BIG} fill="url(#gsk)"/>${cloud(110,50,.7)}<rect x="-400" y="370" width="1100" height="600" fill="#8fd67a"/><path d="M96 520Q130 440 150 372Q170 440 204 520Z" fill="#e9d6a8" opacity=".8"/><g stroke="#c94a5a" stroke-width="5" stroke-linecap="round"><path d="M196 380L222 230L248 380M248 380L274 230L300 380M222 230H274"/></g><path d="M236 230V320M260 230V320" stroke="#888" stroke-width="2"/><rect x="230" y="318" width="36" height="7" rx="3" fill="#ffd84d"/><rect x="-20" y="250" width="16" height="130" fill="#9c6644"/>${C(-12,220,40,'#5cbf5c')+C(28,250,30,'#6fcf6a')+C(-30,180,30,'#6fcf6a')}${C(14,232,5,'#ff6b6b')+C(-20,200,5,'#ff6b6b')}<g fill="#4dabf7" stroke="#2f7fc4" stroke-width="2"><path d="M40 380L60 300L72 300L120 380L106 380L66 314L54 380Z"/></g><path d="M54 300V380" stroke="#888" stroke-width="3"/>${[[30,420],[270,440],[220,470]].map(p=>C(p[0],p[1],5,'#fff')+C(p[0],p[1],2,'#ffb020')).join('')}`},
 {n:'Party',f:()=>`<rect ${BIG} fill="#fff4d6"/><path d="M-20 24Q150 70 320 24" fill="none" stroke="#c99bff" stroke-width="2"/>${[0,1,2,3,4,5,6,7].map(i=>{const x=6+i*40,y=24+46*Math.sin(Math.PI*(x+20)/340)*.9;return `<path d="M${x-12} ${y-4}L${x+12} ${y-4}L${x} ${y+18}Z" fill="${['#ff6b6b','#ffd84d','#69db7c','#4dabf7','#9775fa'][i%5]}"/>`}).join('')}${[[24,120,'#ff6fae'],[54,150,'#7fd6ff'],[262,110,'#ffd84d'],[284,160,'#9775fa']].map(([x,y,c])=>`<path d="M${x} ${y+26}Q${x+6} ${y+80} ${x-4} ${y+140}" stroke="#aaa" fill="none"/><ellipse cx="${x}" cy="${y}" rx="20" ry="25" fill="${c}"/><ellipse cx="${x-7}" cy="${y-9}" rx="4" ry="7" fill="#fff" opacity=".5"/>`).join('')}<rect x="-400" y="410" width="1100" height="500" fill="#ffd1e3"/><rect x="222" y="340" width="100" height="12" fill="#ff8fc8"/><rect x="232" y="352" width="8" height="58" fill="#ff8fc8"/><rect x="236" y="306" width="54" height="34" rx="4" fill="#fff" stroke="#f3b6d4" stroke-width="2"/><path d="M236 316Q250 326 263 316Q276 326 290 316" fill="none" stroke="#ff6fae" stroke-width="4"/>${[248,263,278].map(x=>`<rect x="${x-2}" y="290" width="4" height="16" fill="#7fd6ff"/><ellipse cx="${x}" cy="286" rx="3" ry="5" fill="#ffb020"/>`).join('')}${[[20,450],[60,470],[260,460]].map(p=>`<rect x="${p[0]}" y="${p[1]}" width="5" height="5" fill="#9775fa" transform="rotate(30 ${p[0]} ${p[1]})"/>`).join('')}`},
 {n:'Pool',f:()=>`<rect ${BIG} fill="#a8e2ff"/>${C(250,60,26,'#ffd54a')}${cloud(30,60,.7)}<rect x="-400" y="250" width="1100" height="180" fill="#5fd0f0"/><rect x="-400" y="244" width="1100" height="10" fill="#fff"/>${[290,330,370].map(y=>`<path d="M-20 ${y}q15-6 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>`).join('')}<ellipse cx="50" cy="320" rx="30" ry="12" fill="none" stroke="#ff6fae" stroke-width="12" stroke-dasharray="14 10"/><path d="M256 250V320M282 250V320M256 270H282M256 292H282" stroke="#c0c6d6" stroke-width="5" stroke-linecap="round"/><rect x="-400" y="420" width="1100" height="500" fill="#fff"/>${[...Array(12)].map((_,i)=>`<rect x="${i*30-30}" y="420" width="15" height="15" fill="#bfe8ff"/><rect x="${i*30-15}" y="435" width="15" height="15" fill="#bfe8ff"/>`).join('')}`},

 if(H.tie)g+=C(90,114,9,'#ff6fae')+C(210,114,9,'#ff6fae');

 if(H.scr)g2+=[[104,74],[196,74]].map(([x,y])=>C(x,y,10,'#e0303f','stroke="#b01f2e" stroke-width="2"')+C(x-4,y-3,1.8,'#fff')+C(x+4,y+1,1.8,'#fff')+C(x-1,y+5,1.8,'#fff')).join('');
 if(H.braid)g+=C(76,322,7,'#ff6fae')+C(224,322,7,'#ff6fae');
 g+=`</g><g transform="${BT}">`;
 const arm='M124 224Q104 250 98 296L113 299Q117 262 132 240Z';
 g+=`<g fill="${sk}" stroke="${so}" stroke-width="2" stroke-linejoin="round"><path d="M128 296V432Q137 440 146 432V296Z"/><path d="M154 296V432Q163 440 172 432V296Z"/>${pth(arm)}${M(pth(arm))}<rect x="139" y="194" width="22" height="30"/><path d="M122 220Q150 214 178 220L180 300Q150 306 120 300Z"/></g>`;
 if(!s.dress&&!s.top)g+=`<path d="M126 228Q150 236 174 228L178 300Q150 306 122 300Z" fill="#f4ecff" stroke="#d9cdf0" stroke-width="2"/>`;
 if(!s.dress&&!s.bottom)g+=`<path d="M120 292L180 292L182 318L154 320L150 308L146 320L118 318Z" fill="#f4ecff" stroke="#d9cdf0" stroke-width="2"/>`;
 g+=SHOES[s.shoes].f();
 if(s.dress)g+=DRESSES[s.dress].f();else g+=TOPS[s.top].f()+BOTS[s.bottom].f();
 g+=`<g fill="${sk}" stroke="${so}" stroke-width="2">${C(105,300,9,sk)}${C(195,300,9,sk)}</g>${GB?GOODS[s.goodie].f():''}</g><g transform="${HT}"><g fill="${sk}" stroke="${so}" stroke-width="2">${C(74,150,12,sk)}${C(226,150,12,sk)}<path d="M74 130Q74 62 150 62Q226 62 226 130Q226 196 150 208Q74 196 74 130Z"/></g>`;
 g+=`<path d="M108 117Q120 111 132 117M168 117Q180 111 192 117" fill="none" stroke="${shade(hc,-.25)}" stroke-width="3.5" stroke-linecap="round"/>`;
 g+=EYES[s.eyes].f(EYEC[s.eyeColor]);
 g+=`<ellipse cx="104" cy="176" rx="12" ry="7" fill="#ff8fa8" opacity=".45"/><ellipse cx="196" cy="176" rx="12" ry="7" fill="#ff8fa8" opacity=".45"/>`;
 g+=MOUTHS[s.mouth].f();
 g+=`<path d="${FR[H.f]}" fill="${hc}" stroke="${ho}" stroke-width="2.5" stroke-linejoin="round"/><path d="M104 74Q150 56 196 74" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".35"/>`;
 g+=g2+HATS[s.hat].f()+(GB?'':GOODS[s.goodie].f())+'</g></g></g>';
 return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${defs}${g}</svg>`;
}

const FRIENDS=[
 {n:'Ivy',s:{skin:1,hairStyle:8,hairColor:1,eyes:0,eyeColor:7,mouth:1,top:0,bottom:0,dress:17,shoes:9,hat:0,goodie:12,scene:15}},
 {n:'Ivy party',s:{skin:1,hairStyle:10,hairColor:1,eyes:0,eyeColor:7,mouth:0,top:0,bottom:0,dress:19,shoes:1,hat:15,goodie:14,scene:12}},
 {n:'Emily',s:{baby:1,skin:0,hairStyle:9,hairColor:10,eyes:0,eyeColor:7,mouth:5,top:0,bottom:0,dress:18,shoes:0,hat:1,goodie:0,scene:12}},
 {n:'Sunny',s:{skin:3,hairStyle:5,hairColor:3,eyes:0,eyeColor:2,mouth:1,top:0,bottom:0,dress:2,shoes:2,hat:6,goodie:9,scene:4}},
 {n:'Luna',s:{skin:1,hairStyle:1,hairColor:6,eyes:1,eyeColor:3,mouth:0,top:0,bottom:0,dress:5,shoes:7,hat:7,goodie:8,scene:3}},
 {n:'Bea',s:{skin:4,hairStyle:4,hairColor:1,eyes:3,eyeColor:0,mouth:3,top:0,bottom:0,dress:6,shoes:1,hat:3,goodie:5,scene:2}},
 {n:'Pip',s:{skin:1,hairStyle:5,hairColor:9,eyes:0,eyeColor:2,mouth:4,top:0,bottom:0,dress:9,shoes:8,hat:10,goodie:10,scene:14}},
 {n:'Coco',s:{skin:0,hairStyle:7,hairColor:2,eyes:0,eyeColor:1,mouth:4,top:6,bottom:6,dress:0,shoes:3,hat:9,goodie:3,scene:13}}
];
const TABS=[
 {n:'Friends',k:'friend',list:FRIENDS,vb:'10 0 280 470'},
 {n:'Skin',k:'skin',list:SKIN.map((c,i)=>({n:'Skin '+(i+1)})),vb:'60 50 180 180'},
 {n:'Hair',k:'hairStyle',list:HAIR,vb:'20 0 260 380',sw:['hairColor',HAIRC]},
 {n:'Eyes',k:'eyes',list:EYES,vb:'92 112 116 72',sw:['eyeColor',EYEC]},
 {n:'Mouth',k:'mouth',list:MOUTHS,vb:'118 160 64 40'},
 {n:'Tops',k:'top',list:TOPS,vb:'82 196 136 122'},
 {n:'Bottoms',k:'bottom',list:BOTS,vb:'78 276 144 164'},
 {n:'Dresses',k:'dress',list:DRESSES,vb:'40 196 220 256'},
 {n:'Shoes',k:'shoes',list:SHOES,vb:'100 372 100 82'},
 {n:'Hats',k:'hat',list:HATS,vb:'40 0 220 170'},
 {n:'Extras',k:'goodie',list:GOODS,vb:'20 90 260 270'},
 {n:'Places',k:'scene',list:SCENES,vb:'0 0 300 500'}
];
const DEF={skin:0,hairStyle:2,hairColor:4,eyes:0,eyeColor:1,mouth:0,top:1,bottom:1,dress:0,shoes:1,hat:1,goodie:0,scene:0};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign({},DEF,store.get('ivyDoll')||{});
let tab=0,hist=[],looks=store.get('ivyLooks')||[];
const $=id=>document.getElementById(id);

function render(anim){
 $('doll').innerHTML=doll(S,'0 0 300 500',true,anim?'pop':'');
 $('tabs').innerHTML=TABS.map((t,i)=>`<button class="tab${i==tab?' on':''}" data-tab="${i}" aria-label="${t.n}">${doll(t.k=='friend'?Object.assign({},DEF,FRIENDS[0].s):S,t.k=='friend'?'60 30 180 200':t.vb,t.k=='scene')}<span>${t.n}</span></button>`).join('');
 const t=TABS[tab];
 $('sw').innerHTML=t.sw?t.sw[1].map((c,i)=>`<button class="${S[t.sw[0]]==i?'on':''}" style="background:${c}" data-sw="${i}" aria-label="Color ${i+1}"></button>`).join(''):'';
 $('sw').style.display=t.sw?'':'none';
 $('grid').innerHTML=t.list.map((it,i)=>{const on=S[t.k]==i?' on':'';
  if(it.n=='None'||it.n=='Barefoot'&&false)return `<button class="item none${on}" data-item="${i}" aria-label="None">×</button>`;
  if(t.k=='friend')return `<button class="item" data-item="${i}" aria-label="${it.n}">${doll(Object.assign({},DEF,it.s),t.vb)}<b class="nm">${it.n}</b></button>`;
  const s2=Object.assign({},S,{[t.k]:i});
  if(t.k=='dress'&&i){s2.top=0;s2.bottom=0}
  if((t.k=='top'||t.k=='bottom')&&i)s2.dress=0;
  return `<button class="item${on}" data-item="${i}" aria-label="${it.n}">${doll(s2,t.vb,t.k=='scene')}</button>`}).join('');
 $('looks').innerHTML=looks.length?looks.map((l,i)=>`<button class="look" data-look="${i}" aria-label="Saved look ${i+1}">${doll(Object.assign({},DEF,l),'0 0 300 500')}<i data-del="${i}">×</i></button>`).join(''):'<p class="hint">Tap the heart to save a look here.</p>';
 $('undoBtn').disabled=!hist.length;
 store.set('ivyDoll',S);
}
function change(fn){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();fn();render(true)}
function setItem(k,v){if(k=='friend')return change(()=>{S=Object.assign({},DEF,FRIENDS[v].s)});change(()=>{S[k]=v;if(k=='dress'&&v){S.top=0;S.bottom=0}if((k=='top'||k=='bottom')&&v)S.dress=0})}
const rnd=n=>Math.floor(Math.random()*n);

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(e.target.dataset.del!==undefined){looks.splice(+e.target.dataset.del,1);store.set('ivyLooks',looks);render();return}
 if(d.tab!==undefined){tab=+d.tab;render();$('grid').scrollTop=0}
 else if(d.item!==undefined)setItem(TABS[tab].k,+d.item);
 else if(d.sw!==undefined)setItem(TABS[tab].sw[0],+d.sw);
 else if(d.look!==undefined)change(()=>{S=Object.assign({},DEF,looks[+d.look])});
 else if(d.act=='undo'&&hist.length){S=JSON.parse(hist.pop());render(true)}
 else if(d.act=='random')change(()=>{S={skin:S.skin,hairStyle:rnd(HAIR.length),hairColor:rnd(HAIRC.length),eyes:rnd(EYES.length),eyeColor:rnd(EYEC.length),mouth:rnd(MOUTHS.length),shoes:1+rnd(SHOES.length-1),hat:rnd(HATS.length),goodie:rnd(GOODS.length),scene:rnd(SCENES.length),top:0,bottom:0,dress:0};if(Math.random()<.5)S.dress=1+rnd(DRESSES.length-1);else{S.top=1+rnd(TOPS.length-1);S.bottom=1+rnd(BOTS.length-1)}});
 else if(d.act=='clear')change(()=>{Object.assign(S,{top:0,bottom:0,dress:0,shoes:0,hat:0,goodie:0})});
 else if(d.act=='save'){looks.unshift(Object.assign({},S));looks=looks.slice(0,12);store.set('ivyLooks',looks);render(true)}
});
render();
}
</script>
</body>
</html>
